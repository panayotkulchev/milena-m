};

const SUPPORTED=['bg','en','ru'];
let currentLang='bg';
let detectedLang=null;
let toastTimer=null;
const toastMessages={en:{icon:'🇬🇧',msg:'We detected English as your language.',btn:'Switch to English'},ru:{icon:'🇷🇺',msg:'Определён русский язык браузера.',btn:'Перейти на русский'}};

async function detectLanguage(){
  const saved=localStorage.getItem('milena_lang');
  if(saved&&SUPPORTED.includes(saved))return{lang:saved,source:'saved'};
  const navLangs=navigator.languages||[navigator.language||'bg'];
  for(const nl of navLangs){if(nl.toLowerCase().includes('-bg'))return{lang:'bg',source:'region'};}
  try{
    const res=await Promise.race([fetch('https://ipapi.co/json/'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),2500))]);
    const data=await res.json();
    if(data.country_code==='BG')return{lang:'bg',source:'geo'};
  }catch(e){}
  for(const nl of navLangs){const code=nl.substring(0,2).toLowerCase();if(SUPPORTED.includes(code))return{lang:code,source:'browser'};}
  return{lang:'bg',source:'fallback'};
}

function showToast(lang){
  const tm=toastMessages[lang];if(!tm)return;
  document.getElementById('toastIcon').textContent=tm.icon;
  document.getElementById('toastMsg').textContent=tm.msg;
  document.getElementById('toastBtn').textContent=tm.btn;
  detectedLang=lang;
  document.getElementById('langToast').classList.add('show');
  toastTimer=setTimeout(()=>dismissToast(),8000);
}
function confirmLang(){if(detectedLang)setLang(detectedLang,true);dismissToast();}
function dismissToast(){
  document.getElementById('langToast').classList.remove('show');
  clearTimeout(toastTimer);
  if(!localStorage.getItem('milena_lang'))localStorage.setItem('milena_lang',currentLang);
}

function applyTranslations(){
  const t=T[currentLang];
  document.querySelectorAll('[data-t]').forEach(el=>{const key=el.getAttribute('data-t');if(t[key]!==undefined)el.innerHTML=t[key];});
  document.querySelectorAll('[data-placeholder]').forEach(el=>{const key=el.getAttribute('data-placeholder');if(t[key]!==undefined)el.placeholder=t[key];});
  const nl=document.getElementById('navLogo');const fl=document.getElementById('footerLogo');
  if(nl)nl.innerHTML=t.logo_main;if(fl)fl.innerHTML=t.logo_footer;
  document.documentElement.lang=currentLang;
  document.querySelectorAll('.flag-btn').forEach(b=>{const map={'БГ':'bg','EN':'en','РУ':'ru'};b.classList.toggle('active',map[b.textContent.trim()]===currentLang);});
}

function setLang(lang,manual=false){currentLang=lang;if(manual)localStorage.setItem('milena_lang',lang);applyTranslations();}
function showPage(id,navEl){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');document.querySelectorAll('.nav-center a,.mobile-menu a').forEach(a=>a.classList.remove('active'));if(navEl)navEl.classList.add('active');window.scrollTo(0,0);closeMenu();}
function toggleMenu(){document.getElementById('hamburger').classList.toggle('open');document.getElementById('mobileMenu').classList.toggle('open');}
function closeMenu(){document.getElementById('hamburger').classList.remove('open');document.getElementById('mobileMenu').classList.remove('open');}

(async function init(){
  currentLang='bg';applyTranslations();
  const result=await detectLanguage();
  currentLang=result.lang;applyTranslations();
  if(result.source==='browser'&&result.lang!=='bg'){setTimeout(()=>showToast(result.lang),800);}
})();

emailjs.init('Kg6Li-fDJmDD61PA6');

const formSuccessMsg = {
  bg: '✓ Благодарим! Вашето запитване беше изпратено успешно. Ще се свържем с вас скоро.',
  en: '✓ Thank you! Your enquiry has been sent successfully. We will be in touch shortly.',
  ru: '✓ Спасибо! Ваш запрос успешно отправлен. Мы свяжемся с вами в ближайшее время.'
};
const formErrorMsg = {
  bg: '✗ Съжаляваме, имаше проблем при изпращането. Моля обадете се на 0899 939 850.',
  en: '✗ Sorry, there was a problem sending your message. Please call 0899 939 850.',
  ru: '✗ Извините, произошла ошибка при отправке. Пожалуйста, позвоните на 0899 939 850.'
};

// Add success/error messages to T object
Object.keys(T).forEach(lang => {
  T[lang].form_success = formSuccessMsg[lang];
  T[lang].form_error = formErrorMsg[lang];
});

function sendEmail(e, form) {
  e.preventDefault();
  const btn = form.querySelector('.form-submit');
  const successEl = document.getElementById('formSuccess');
  const errorEl = document.getElementById('formError');
  successEl.style.display = 'none';
  errorEl.style.display = 'none';

  // Button loading state
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = currentLang === 'ru' ? 'Отправка...' : currentLang === 'en' ? 'Sending...' : 'Изпращане...';

  const templateParams = {
    from_name: form.from_name.value,
    reply_to:  form.reply_to.value || '(не е посочен / not provided)',
    phone:     form.phone.value    || '(не е посочен / not provided)',
    service:   form.service.value,
    message:   form.message.value  || '(без съобщение / no message)',
    site_lang: currentLang.toUpperCase()
  };

  emailjs.send('service_h980hcb', 'template_yg4fwdk', templateParams)
    .then(() => {
      successEl.innerHTML = T[currentLang].form_success;
      successEl.style.display = 'block';
      form.reset();
      // Re-apply placeholders after reset
      applyTranslations();
    })
    .catch((err) => {
      console.error('EmailJS error:', err);
      errorEl.innerHTML = T[currentLang].form_error;
      errorEl.style.display = 'block';
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = origText;
    });
}
